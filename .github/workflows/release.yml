name: Release

# 发布流程（人工双段式）：
#
#   1. Actions → "Release" → "Run workflow"，填 VERSION（不带 v 前缀）
#   2. `build` job 自动跑：编译 + 签名 + 公证(如果配齐了 secrets) + 上传 DMG
#      到 workflow artifact
#   3. `publish` job 卡在 "Waiting for review"。审阅 build job 日志 / 下载
#      artifact 试装 → 满意了 → Approve
#   4. publish job 自动跑：下 artifact，gh release create 上传到 GitHub
#      Release，按 prerelease/正式自动判定（VERSION 含 `-` → prerelease）
#
# 不做自动 tag 触发 —— 防止误推 tag 直接走到 Release 页面。任何发布都要
# 人主动从 Actions UI 触发。
#
# 签名 / 公证 (gracefully degrades)：
#   - 如果 repo secrets 配齐了，自动用 Developer ID 签名 + 公证 DMG。
#   - 任何一项缺失，自动 fallback 到 ad-hoc + 不公证（DMG 还是产出，只是
#     Gatekeeper 第一次打开要右键 Open）。
#
#   需要的 secrets（详见 PACKAGING.md "GitHub Secrets" 一节）：
#     APPLE_DEV_ID_CERT_P12_BASE64  — Developer ID Application 证书的 .p12 base64
#     APPLE_DEV_ID_CERT_PASSWORD    — 该 .p12 的导出密码
#     APPLE_DEV_ID_IDENTITY         — codesign --sign 用的字符串，比如
#                                      "Developer ID Application: Your Name (TEAMID)"
#     APPLE_NOTARY_APPLE_ID         — 公证用的 Apple ID（你的开发者账号）
#     APPLE_NOTARY_TEAM_ID          — 团队 ID (10 位字符)
#     APPLE_NOTARY_PASSWORD         — Apple ID 的 App-Specific Password
#                                      (https://appleid.apple.com → Sign-In and Security)
#
# 一次性配置 —— "Approve to release" 这道闸需要先在仓库里建一个 environment：
#   GitHub repo → Settings → Environments → "New environment" → 名字 `release`
#     → 勾 "Required reviewers" 加你自己（或团队）
#   建完 publish job 才会真正卡住等审批；不建的话会直接发出去（环境不存在
#   不阻塞 workflow，要 explicit 配）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (no leading v), e.g. 0.3.0 or 0.3.0-rc1'
        required: true
        default: '0.0.0-dev'
      prerelease:
        description: 'Mark as prerelease (auto-on if VERSION contains "-")'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write   # 必需：gh release create 要写 Release assets

jobs:

  # ── Stage 1: build + sign + notarize, upload DMG as artifact ─────────────
  build:
    name: Build · Sign · Notarize
    runs-on: macos-15
    timeout-minutes: 50
    outputs:
      version: ${{ steps.ver.outputs.version }}
      dmg-name: ${{ steps.ver.outputs.dmg-name }}
      is-prerelease: ${{ steps.ver.outputs.is-prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0    # 用于 gh release 的 release-notes 生成

      # Formal releases (no `-` in VERSION → marked stable on the
      # Releases page) MUST come from main. main 走完整 status check
      # + review 流程，feature branch 没有这个保证。Prereleases (rc /
      # alpha / beta) can still come from any branch — that's the whole
      # point of dispatch from a working branch.
      - name: Refuse formal release from non-main ref
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
              echo "VERSION=$VERSION → prerelease, ref check skipped"
              exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error title=Refusing non-main formal release::Cannot publish formal v$VERSION from $GITHUB_REF. Merge to main first, then re-run from main."
              exit 1
          fi
          echo "VERSION=$VERSION (formal) on $GITHUB_REF — proceeding"

      - name: Compute VERSION
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          DMG_NAME="meee2-v${VERSION}.dmg"
          # 含 "-" 的（rc1 / alpha / beta）默认 prerelease；明示 input 可强制
          if [[ "$VERSION" =~ - ]] || [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
              IS_PRERELEASE="true"
          else
              IS_PRERELEASE="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg-name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (prerelease=$IS_PRERELEASE)"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      # WebDist 是 vite build 输出，repo 里只剩 .gitkeep。create-dmg.sh 在
      # pnpm 不存在时会 fallback "use existing WebDist" 然后把空 .gitkeep 打进
      # .app → Board 窗口 404。release runner 必须装 pnpm；validate(ci.yml)
      # 已经装，release 之前漏了 → v0.4.0 DMG 的 Board 全空。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-universal-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-universal-
            ${{ runner.os }}-spm-release-
            ${{ runner.os }}-spm-

      # SwiftPM 把 Sources/Board/WebDist 声明为 .copy resource —— 目录在 repo
      # 里靠 .gitkeep 占位（vite 产物 .gitignore 掉了）。空目录时 SwiftPM 不
      # 生成 Bundle.module accessor，BoardWebDistLocator.swift 就编不过。
      # build.sh 里会跑 pnpm build，但那一步在 Sanity test 之后；要让 sanity
      # 真正测到带 WebDist 的 bundle，必须在 swift test 前先填一遍。
      - name: Build web frontend (populate Sources/Board/WebDist)
        run: |
          pnpm install --frozen-lockfile=false
          pnpm -F @meee1/board-app build

      # 先跑一次 test 作 sanity —— 挂掉的 build 不该 release
      - name: Sanity test
        run: swift test --parallel

      # ── Apple Developer ID signing keychain setup (only if secrets present) ──
      # apple-actions/import-codesign-certs handles the whole keychain
      # dance (create temp keychain, import .p12, set partition list,
      # prepend to search list) reliably across runner image variants.
      # Manual `security import` in shell tripped on
      # `SecKeychainItemImport: One or more parameters ... not valid`
      # on macos-15 runners despite working locally — the action's
      # `keychain-password` defaults are tested against many edge cases
      # we'd otherwise have to reverse-engineer.
      - name: Compute signing-secrets gate
        id: signing-gate
        run: |
          if [ -n "${{ secrets.APPLE_DEV_ID_CERT_P12_BASE64 }}" ] \
              && [ -n "${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}" ] \
              && [ -n "${{ secrets.APPLE_DEV_ID_IDENTITY }}" ]; then
              echo "configured=1" >> "$GITHUB_OUTPUT"
          else
              echo "configured=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        id: signing
        if: ${{ steps.signing-gate.outputs.configured == '1' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEV_ID_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
          # Use a runner-scoped keychain alias; cleaned up automatically
          keychain: meee2-signing
          keychain-password: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}

      # ── Notary credentials profile (only if secrets present) ─────────────
      # ⚠️ 两个独立 step：
      #   1. notary-gate: 把 secrets.* 比较结果落进 step output（secrets 在
      #      step body 里 OK，但 step `if` 不允许引用 secrets context）。
      #   2. notary: 用上一步的 output gate；output 是 step context，可在 if 用。
      # store-credentials 把 Apple ID + Team + app-specific password 存进
      # keychain alias，后面 notarize.sh 用 --keychain-profile 引用。
      - name: Compute notary-secrets gate
        id: notary-gate
        run: |
          if [ -n "${{ secrets.APPLE_NOTARY_APPLE_ID }}" ] \
              && [ -n "${{ secrets.APPLE_NOTARY_TEAM_ID }}" ] \
              && [ -n "${{ secrets.APPLE_NOTARY_PASSWORD }}" ]; then
              echo "configured=1" >> "$GITHUB_OUTPUT"
          else
              echo "configured=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up notary credentials
        id: notary
        if: ${{ steps.notary-gate.outputs.configured == '1' && steps.signing-gate.outputs.configured == '1' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_SPECIFIC_PWD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials meee2-notary \
              --apple-id "$APPLE_ID" \
              --team-id "$TEAM_ID" \
              --password "$APP_SPECIFIC_PWD"
          echo "configured=1" >> "$GITHUB_OUTPUT"

      - name: Build release + package DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SKIP_FINDER_UI: '1'      # 跳过 Finder AppleScript styling，headless runner 无 Finder
          UNIVERSAL: '1'           # CI 一律产 universal binary 让 Intel Mac 能跑
          IDENTITY: ${{ steps.signing-gate.outputs.configured == '1' && secrets.APPLE_DEV_ID_IDENTITY || '' }}
          NOTARIZE: ${{ steps.notary.outputs.configured == '1' && '1' || '0' }}
          NOTARY_PROFILE: ${{ steps.notary.outputs.configured == '1' && 'meee2-notary' || '' }}
          NOTARIZE_APP: ${{ steps.notary.outputs.configured == '1' && '1' || '0' }}
        run: |
          if [ -n "${IDENTITY:-}" ]; then
              echo "Building with Developer ID signing: $IDENTITY"
              [ "$NOTARIZE" = "1" ] && echo "Notarization: ON" || echo "Notarization: OFF (no notary creds)"
          else
              echo "Building with ad-hoc signature (no APPLE_DEV_ID_* secrets configured)."
              echo "Distributed DMG will require right-click → Open on first launch."
          fi
          ./create-dmg.sh
          ls -lh dist/

      - name: Compute SHA256
        env:
          DMG_NAME: ${{ steps.ver.outputs.dmg-name }}
        run: |
          shasum -a 256 "dist/${DMG_NAME}" | tee "dist/${DMG_NAME}.sha256"

      # Gatekeeper sanity assess —— 只在真签名/公证完才有意义
      - name: Verify signature + notarization
        if: ${{ steps.notary.outputs.configured == '1' }}
        env:
          DMG_NAME: ${{ steps.ver.outputs.dmg-name }}
        run: |
          echo "=== spctl assess ==="
          spctl --assess --type open --context context:primary-signature -vvv "dist/${DMG_NAME}" || \
              echo "(spctl returned non-zero — review above output)"
          echo
          echo "=== stapler validate ==="
          xcrun stapler validate "dist/${DMG_NAME}"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: meee2-v${{ steps.ver.outputs.version }}-dmg
          path: |
            dist/meee2-v*.dmg
            dist/meee2-v*.dmg.sha256
          retention-days: 30
          if-no-files-found: error

  # ── Stage 2: human-gated GitHub Release publish ──────────────────────────
  # 卡在 environment "release" 的 required reviewers —— 你在 GitHub UI 里
  # Approve 之后才会跑这里。Approve 之前 publish 一直显示 "Waiting"。
  publish:
    name: Publish to GitHub Releases (manual approval)
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    environment:
      name: release
      url: ${{ steps.create.outputs.url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gh release --generate-notes 需要历史

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: meee2-v${{ needs.build.outputs.version }}-dmg
          path: dist/

      - name: Create GitHub Release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          DMG_NAME: ${{ needs.build.outputs.dmg-name }}
          IS_PRERELEASE: ${{ needs.build.outputs.is-prerelease }}
        run: |
          TAG="v${VERSION}"
          TITLE="meee2 v${VERSION}"
          PRERELEASE_FLAG=""
          [ "$IS_PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          DMG="dist/${DMG_NAME}"
          SHA="dist/${DMG_NAME}.sha256"

          # 已存在同 tag → 上传 / 覆盖 asset；否则新建 + 自动 release notes
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists; re-uploading assets"
              gh release upload "$TAG" "$DMG" "$SHA" --clobber
              URL=$(gh release view "$TAG" --json url -q .url)
          else
              echo "Creating release $TAG"
              gh release create "$TAG" \
                  --title "$TITLE" \
                  $PRERELEASE_FLAG \
                  --generate-notes \
                  "$DMG" "$SHA"
              URL=$(gh release view "$TAG" --json url -q .url)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Released::$URL"

      # ── Sparkle: append signed appcast entry + push to `appcast` branch ────
      # `appcast` is a dedicated, non-protected branch hosting just
      # appcast.xml. main has classic branch protection (status checks +
      # enforce_admins) that blocks even the GITHUB_TOKEN from pushing,
      # so we keep the feed file off main. SUFeedURL in App/Info.plist
      # points at https://raw.githubusercontent.com/.../appcast/appcast.xml
      # to match. Same gate pattern as signing/notary — skipped silently
      # when SPARKLE_ED_PRIVATE_KEY_BASE64 is unset.
      - name: Compute sparkle-secret gate
        id: sparkle-gate
        run: |
          if [ -n "${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}" ]; then
              echo "configured=1" >> "$GITHUB_OUTPUT"
          else
              echo "configured=0" >> "$GITHUB_OUTPUT"
          fi

      # Checkout the `appcast` branch into a side directory. token:
      # GITHUB_TOKEN inherits `contents: write` from job permissions.
      - name: Checkout appcast branch
        if: ${{ steps.sparkle-gate.outputs.configured == '1' }}
        uses: actions/checkout@v4
        with:
          ref: appcast
          path: appcast-checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update + sign appcast.xml
        if: ${{ steps.sparkle-gate.outputs.configured == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          PRIV_BASE64: ${{ secrets.SPARKLE_ED_PRIVATE_KEY_BASE64 }}
        run: |
          # Decode private key to a runner-temp file (cleaned up at job end)
          PRIV="$RUNNER_TEMP/sparkle-priv.key"
          printf '%s' "$PRIV_BASE64" | base64 -d > "$PRIV"
          chmod 600 "$PRIV"

          # sparkle-publish.sh lives in the build-time checkout (default cwd);
          # the appcast.xml lives in the appcast branch checkout. cd there,
          # call the script via absolute path.
          SCRIPT="$GITHUB_WORKSPACE/scripts/sparkle-publish.sh"
          cd appcast-checkout
          SPARKLE_ED_PRIVATE_KEY="$PRIV" REPO="${{ github.repository }}" \
              bash "$SCRIPT"

          # Erase the decoded private key ASAP (it's also still in env, but
          # the file is the higher-leverage exposure).
          rm -f "$PRIV"

      - name: Commit appcast.xml to appcast branch
        if: ${{ steps.sparkle-gate.outputs.configured == '1' }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd appcast-checkout
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `git add` first so new (untracked) files also count — `git diff`
          # alone returns "no diff" for an untracked appcast.xml on the very
          # first run and the early-exit silently swallows the commit. After
          # adding, --cached --quiet is the right check.
          git add appcast.xml
          if git diff --cached --quiet; then
              echo "appcast.xml unchanged; nothing to commit"
              exit 0
          fi
          git commit -m "chore(appcast): publish v${VERSION} [skip ci]" \
              -m "Auto-generated by .github/workflows/release.yml — Sparkle EdDSA-signed appcast entry for the notarized DMG just attached to the v${VERSION} release."
          git push origin appcast
