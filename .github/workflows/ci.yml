name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  board-packages:
    name: Board Packages · Build · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build board packages
        run: pnpm build

      - name: Typecheck board packages
        run: pnpm typecheck

  board-tests:
    name: Board Packages · Test · Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # board-app imports sibling packages' .d.ts; build the workspace first so
      # vitest can resolve cross-package types (mirrors the validate job).
      - name: Build board packages
        run: pnpm build

      - name: Run board-app tests with coverage
        working-directory: packages/board-app
        run: pnpm test:cov 2>&1 | tee /tmp/vitest-cov.txt

      - name: Coverage → job summary
        if: always()
        run: |
          {
            echo "## board-app test coverage (planner)"
            echo ""
            echo "> Test failures block this CI job; coverage remains diagnostic."
            echo ""
            echo '```'
            awk '/Coverage report from v8/{p=1} p' /tmp/vitest-cov.txt || cat /tmp/vitest-cov.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-app-coverage-html
          path: packages/board-app/coverage/
          retention-days: 14
          if-no-files-found: warn

  validate:
    name: Build · Test · Lint
    # macos-15 (Xcode 16 / Swift 6) — macos-14 ships Xcode 15.4 / Swift 5.10
    # which rejects this codebase's Task-captured-var concurrency patterns
    # in pushToDesktopNow etc. (Swift 6 in Swift-5-language-mode allows them
    # silently, Swift 5.10 errors out). release.yml is on macos-15 since
    # 2026-05-06 — keep the two CI surfaces aligned.
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # WebDist is gitignored (built artifact). Package.swift's
      # `.copy("Board/WebDist")` resource declaration needs the dir
      # populated before `swift build`. Generate it here — board-packages
      # job already does the same on its ubuntu runner but can't share
      # filesystem with this validate runner.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Build web frontend (SwiftPM resource)
        run: |
          pnpm install --frozen-lockfile
          # Whole-workspace build, not `-F @meee1/board-app`. board-app
          # depends on @meee1/{board-cards,board-core,board-ui,
          # board-persistence-http} via workspace:* — those need to emit
          # their .d.ts before tsc on board-app can resolve the imports.
          pnpm build

      - name: Enforce Board bundle budgets
        run: ./scripts/check-board-bundle-size.sh

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Build (debug)
        run: swift build

      - name: Verify isolated HOME gate
        run: ./scripts/tests/test-isolated-home-gate.sh

      - name: Test
        # One isolated storage root is intentionally shared by the test
        # process and any CLI children it launches. Keep this gate serial so
        # separate XCTest workers cannot race on that root.
        run: ./scripts/test-isolated-home.sh -- swift test

      - name: Session mutation Thread Sanitizer
        run: ./scripts/test-isolated-home.sh -- swift test --sanitize=thread --filter SessionStoreConcurrencyTests

      - name: Test control-token helper
        run: python3 scripts/tests/test_board_control.py

      - name: SwiftLint (strict)
        run: swiftlint lint --strict --quiet

      - name: Hardcoded path scan
        run: |
          # WebDist 是 vite 打包 web/ 目录的产物，里面会内联 demo session 用的
          # 字面量路径（templatePresets.ts 里的预览卡片）。bundle 是 build artifact，
          # 跟 .build/ 一样不该被扫描。
          HARDCODED=$(grep -rn '"/Users/[a-zA-Z]' Sources/ App/ plugins-builtin/ 2>/dev/null \
            | grep -v '\.build/' \
            | grep -v 'Sources/Board/WebDist/' \
            | grep -v 'Sources//Board/WebDist/' \
            | grep -v 'CLAUDE.md' | grep -v 'Preview' \
            | grep -v '/// ' | grep -v '// ' | grep -v '/Users/test/' || true)
          if [ -n "$HARDCODED" ]; then
            echo "::error::Hardcoded user paths found:"
            echo "$HARDCODED"
            exit 1
          fi

      - name: Bare print() scan in Services
        run: |
          PRINTS=$(grep -rn '^\s*print(' Sources/Services/ 2>/dev/null \
            | grep -v 'HookReceiver.swift' || true)
          if [ -n "$PRINTS" ]; then
            echo "::error::Bare print() in Services (use MLog):"
            echo "$PRINTS"
            exit 1
          fi
